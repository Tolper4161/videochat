<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videochat</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/typography.css" />
    <link rel="stylesheet" href="./css/icons.css" />
    <link rel="stylesheet" href="./css/button.css" />
    <link rel="stylesheet" href="./css/input.css" />
    <link rel="stylesheet" href="./css/sidebar.css" />
    <link rel="stylesheet" href="./css/panel.css">
    <link rel="stylesheet" href="./css/dashboard.css" />
    <link rel="stylesheet" href="./css/videochat.css" />
    <link rel="stylesheet" href="./css/control.css" />
    <link rel="stylesheet" href="./css/room.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body class="dashboard" style="height: 100vh;">
    <nav class="nav ph-100">
        <div class="nav__content">
            <div class="nav__header">
                <a href="#" class="nav-logo-link">
                    <img
                        src="./img/logo-min.svg"
                        alt="Min Logo"
                        class="nav-logo"
                    />
                </a>
                <hr class="nav__line" />
                <ul class="nav-btn-list nav-main">
                    <li class="nav-list-item btn-list-item">
                        <button class="btn-icon icon icon-home nav-btn nav-btn_active"></button>
                    </li>
                    <li class="nav-list-item btn-list-item">
                        <button class="btn-icon icon icon-videochat nav-btn"></button>
                    </li>
                </ul>
            </div>
            <ul class="nav-btn-list nav-footer">
                <li class="nav-list-item btn-list-item">
                    <button class="btn-icon icon icon-bell nav-btn"></button>
                </li>
                <li class="nav-list-item btn-list-item">
                    <button class="btn-icon icon icon-moon nav-btn nav-btn_active"></button>
                </li>
            </ul>
        </div>
    </nav>
    <section class="panel sidebar ph-100">
        <div class="panel-header sidebar__header">
            <b class="panel-header__title">Friends List</b>
            <button class="btn-icon icon icon-plus sidebar__add-btn"></button>
        </div>
        <div class="panel-main">
            <ul class="friends">
                <li class="friend">
                    <img src="./img/avatars/avatar-woman1.svg" alt="" class="friend__avatar" />
                    <span class="friend__username">User123</span>
                </li>
                <li class="friend">
                    <img src="./img/avatars/avatar-man2.svg" alt="" class="friend__avatar" />
                    <span class="friend__username">Lorem Ipsum</span>
                </li>
                <li class="friend">
                    <img src="./img/avatars/avatar-man1.svg" alt="" class="friend__avatar" />
                    <span class="friend__username">Dolor</span>
                </li>
            </ul>
        </div>
        <div class="panel-footer">
            <div class="account">
                <div class="account__info">
                    <img src="./img/avatars/avatar-boy.svg" alt="" class="account__avatar" />
                    <b class="account__username">Username</b>
                </div>
                <button class="btn-icon icon icon-wheel account__btn"></button>
            </div>
        </div>
    </section>
    <section class="videochat">
        <div class="room">
            <span class="room__title">Tolper4161 Room</span>
            <div class="room__content">
                <ul class="room-video">
                    <li class="room-video-item">
                        <div class="room-video-window">
                            <div class="room-video-window__wrap">
                                <img src="./img/avatars/avatar-boy.svg" class="room-video-window__avatar" />
                            </div>
                            <div class="room-video-window__info">
                                <span class="icon icon-microphone-mute-gray room-video-item__username">
                                    Tolper4161
                                </span>
                            </div>
                        </div>
                    </li>
                    <li class="room-video-item">
                        <div class="room-video-window">
                            <div class="room-video-window__wrap">
                                <img src="./img/avatars/avatar-woman1.svg" class="room-video-window__avatar" />
                            </div>
                            <div class="room-video-window__info">
                                <span class="icon icon-microphone-mute-gray room-video-item__username">
                                    User123
                                </span>
                            </div>
                        </div>
                    </li>
                    <li class="room-video-item">
                        <div class="room-video-window">
                            <div class="room-video-window__wrap">
                                <img src="./img/avatars/avatar-man2.svg" class="room-video-window__avatar" />
                            </div>
                            <div class="room-video-window__info">
                                <span class="icon icon-microphone-mute-gray room-video-item__username">
                                    Lorem Ipsum
                                </span>
                            </div>
                        </div>
                    </li>
                    <li class="room-video-item">
                        <div class="room-video-window">
                            <div class="room-video-window__wrap">
                                <img src="./img/avatars/avatar-man1.svg" class="room-video-window__avatar" />
                            </div>
                            <div class="room-video-window__info">
                                <span class="icon icon-microphone-mute-gray room-video-item__username">
                                    Dolor
                                </span>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
        <div class="panel">
            <div class="control">
                <div class="control__left">
                    <button class="btn-icon icon icon-link gray-bg control-btn">Copy Link</button>
                </div>
                <div class="control__mid">
                    <button class="btn-icon icon icon-microphone-mute gray-bg control-btn"></button>
                    <button class="btn-icon icon icon-video-mute gray-bg control-btn"></button>
                    <button class="btn-icon icon icon-translation gray-bg control-btn"></button>
                    <button class="btn-icon icon icon-chat gray-bg control-btn"></button>
                    <button class="btn-icon icon icon-menu-horizontal gray-bg control-btn"></button>
                </div>
                <div class="control__right">
                    <button class="btn-icon icon icon-phone-disconnected red-bg control-btn"></button>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
