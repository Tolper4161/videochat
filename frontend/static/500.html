<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videochat</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/typography.css" />
    <link rel="stylesheet" href="./css/icons.css" />
    <link rel="stylesheet" href="./css/button.css" />
    <link rel="stylesheet" href="./css/error.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body style="height: 100vh;">
    <section class="error">
        <div class="error__content">
            <h1 class="error__code">500</h1>
            <div class="error__info">
                <div class="error__heading">
                    <h2 class="error__name">Internal Server Error</h2>
                    <p class="error__msg">Try refreshing the page or try using the service later</p>
                </div>
                <button class="btn blue-bg form__btn">Refresh Page</button>
            </div>
        </div>
    </section>
</body>
</html>
