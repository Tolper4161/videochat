<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Videochat Login</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/typography.css" />
    <link rel="stylesheet" href="./css/button.css" />
    <link rel="stylesheet" href="./css/input.css" />
    <link rel="stylesheet" href="./css/auth.css" />
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
    <section class="auth">
        <div class="auth__content">
            <div class="auth__left">
                <h1 class="auth__title">Welcome Back</h1>
                <form class="form auth__form">
                    <div class="form-line-group">
                        <div class="form-line">
                            <label
                                for="email"
                                class="form-line-label"
                            >
                                Email
                            </label>
                            <input
                                type="email"
                                name="email"
                                placeholder="example@email.com"
                                id="email"
                                class="form-line-input"
                            />
                        </div>
                        <div class="form-line">
                            <label
                                for="password"
                                class="form-line-label"
                            >
                                Password
                            </label>
                            <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-line-input"
                                placeholder="Enter your password"
                            />
                        </div>
                    </div>
                    <button class="btn blue-bg form__btn">Sign In</button>
                </form>
                <span class="auth__">
                    You haven’t an account yet? <a class="auth__link" href="./register.html">Sign up</a>
                </span>
            </div>
            <div class="auth__right">
                <img src="./img/logo-large.svg" alt="large logo" class="auth-logo" />
            </div>
        </div>
    </section>
</body>
</html>
